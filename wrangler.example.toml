name = "raillog"
compatibility_date = "2026-05-26"
pages_build_output_dir = "dist"

# The application opens without a login. No auth variables, secrets,
# Turnstile configuration, or email service binding are required.
# See docs/public-access.md for existing deployment cleanup.

# For Cloudflare Pages, create a D1 database first, then bind it as DB.
# Replace database_id before renaming this file to wrangler.toml.
[[d1_databases]]
binding = "DB"
database_name = "raillog-db"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"
